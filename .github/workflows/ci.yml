name: Vulnix CI & Security Control Verification

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    # PRs into a feature branch (stacked PRs) are checked too, not only PRs into main
    branches: ["main", "feat/**"]
  workflow_dispatch:

jobs:
  # The real ARTEX browser job uses Playwright Chromium, verified on 24.04.
  # Pin every job to that image so ubuntu-latest cannot change the test platform.
  backend-and-linux-isolation:
    name: Python Suite + Linux Kernel nftables & Emergency Stop Verification
    runs-on: ubuntu-24.04
    env:
      VULNIX_NO_ENV_LOCAL: "1"   # tests never read a .env.local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux nftables and iproute2
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2

      - name: Python static checks (ruff, pinned)
        run: |
          python3 -m pip install --quiet ruff==0.6.9 -r requirements-oidc.txt
          ruff check aegis tests

      - name: Run Python Unit & Integration Test Suite
        run: |
          # Bound a stalled suite while the job may still upload its output.
          # A prior 51-minute failure left no retrievable log; its cause is unknown.
          # Bound the entire pipeline. A child retaining stdout after Python
          # exits must not keep tee (and the artifact upload) waiting forever.
          timeout --signal=INT --kill-after=30s 42m \
            bash -o pipefail -c \
            'python3 -u -X faulthandler -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee python-suite.log'

      - name: Preserve Python suite output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-suite-output-attempt-${{ github.run_attempt }}
          path: python-suite.log
          if-no-files-found: warn
          retention-days: 7

      # Exercise the artifact path after a failed step without failing the suite.
      # Runner loss remains outside this probe's coverage.
      - name: Simulate a failed command for artifact recovery
        id: artifact_failure_probe
        continue-on-error: true
        run: |
          printf 'artifact recovery probe\n' > artifact-failure-probe.txt
          exit 23

      - name: Preserve simulated failure output
        if: ${{ !cancelled() && steps.artifact_failure_probe.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-upload-probe-attempt-${{ github.run_attempt }}
          path: artifact-failure-probe.txt
          if-no-files-found: error
          retention-days: 1

      # The artifact service is eventually consistent: a read right after the upload has
      # failed with "Artifact not found" although the artifact existed (runner-side, see
      # docs/PRODUCT_COMPLETION.md). Read once more after a pause; the assert below still
      # fails the job when the artifact is really missing or different.
      - name: Read back simulated failure output
        id: artifact_read_back
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: failure-upload-probe-attempt-${{ github.run_attempt }}
          path: artifact-failure-probe

      - name: Wait before reading back again
        if: ${{ steps.artifact_read_back.outcome == 'failure' }}
        run: sleep 30

      - name: Read back simulated failure output (second read)
        if: ${{ steps.artifact_read_back.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: failure-upload-probe-attempt-${{ github.run_attempt }}
          path: artifact-failure-probe

      - name: Assert simulated failure was captured
        run: |
          test '${{ steps.artifact_failure_probe.outcome }}' = failure
          cmp artifact-failure-probe.txt artifact-failure-probe/artifact-failure-probe.txt

      - name: Linux kernel confinement end to end (confined L2 worker; stop, revocation, deletion, expiry)
        run: |
          # The same tests also run in the suite above; here a skip is a failure, so
          # a runner without cgroup v2 / nft / sudo cannot pass this step silently.
          python3 -m unittest -v tests.test_release_safety.TestOnLinuxWithTheRealKernelConfinement \
            tests.test_fail_closed.TestKernelConfinementOnLinux 2>&1 | tee linux-e2e.log
          if grep -q "skipped" linux-e2e.log; then echo "Linux confinement tests were skipped"; exit 1; fi
          grep -q "^OK" linux-e2e.log

      - name: Local audit anchor as a separate OS user (rollback of log + reservation file detected)
        run: |
          # docs/AUDIT_ANCHOR.md. The helper runs as its own system user; this job's user
          # may only connect to its socket (directory group), never touch its files.
          # The script never skips: any missing precondition fails the step.
          set -euo pipefail
          PY="$(command -v python3)"
          GROUP="$(id -gn)"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin vulnix-anchor
          sudo install -d -o root -g root -m 0755 /opt/vulnix-anchor
          sudo install -o root -g root -m 0644 aegis/audit_anchor.py /opt/vulnix-anchor/audit_anchor.py
          sudo install -d -o vulnix-anchor -g vulnix-anchor -m 0700 /var/lib/vulnix-anchor
          sudo install -d -o vulnix-anchor -g "$GROUP" -m 0750 /run/vulnix-anchor
          (cd / && sudo -u vulnix-anchor "$PY" /opt/vulnix-anchor/audit_anchor.py serve \
            --dir /var/lib/vulnix-anchor --socket /run/vulnix-anchor/anchor.sock --socket-mode 666 --allow-source ci) \
            > anchor-helper.log 2>&1 &
          for _ in $(seq 100); do [ -S /run/vulnix-anchor/anchor.sock ] && break; sleep 0.1; done
          if ! python3 scripts/audit_anchor_ci.py --socket /run/vulnix-anchor/anchor.sock \
              --anchor-dir /var/lib/vulnix-anchor --helper-uid "$(id -u vulnix-anchor)" \
              --source-name ci 2>&1 | tee audit-anchor-ci.log; then
            cat anchor-helper.log; exit 1
          fi
          grep -q "^AUDIT ANCHOR CI: OK$" audit-anchor-ci.log
          # the helper's own file verifies, and holds what the service anchored
          (cd / && sudo -u vulnix-anchor "$PY" /opt/vulnix-anchor/audit_anchor.py verify --dir /var/lib/vulnix-anchor)
          sudo pkill -u vulnix-anchor || true

      - name: Verify Linux Kernel nftables NetNS Isolation & Emergency Stop (P0)
        run: |
          sudo python3 -m aegis.control_verification

      - name: Verify ARTEX CLI & local OpenAI-compatible adapter round trip (P1)
        run: |
          python3 -c '
          import json
          from aegis.router import verify_planner_connections
          rep = verify_planner_connections()
          print(json.dumps(rep, ensure_ascii=False, indent=2))
          assert rep["all_verified"], rep
          assert rep["abliteration_api"]["endpoint_mode"] == "local_openai_server", rep
          '

      - name: Verify Real Software Stack (SQLite + Sandbox FS) CVE Before/After Remediation (P2)
        run: |
          python3 -m aegis.real_software_cve

  frontend:
    name: Next.js Web UI Tests & Production Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build

  artex-real-planner:
    # The REAL ARTEX planner (github.com/Autumn-27/artex, AGPL-3.0), pinned by commit,
    # built with Vulnix's planner-only overlay and driven by a LOCAL mock LLM. Its
    # intents are rebuilt by Vulnix and executed only through the Gateway.
    name: Real ARTEX planner (overlay build) -> Vulnix Gateway, local mock LLM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # ARTEX's store is PostgreSQL: a throw-away database local to this runner
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-only
          POSTGRES_DB: artex
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U artex" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ARTEX_REPO: jiwoochris/artex-global
      ARTEX_COMMIT: d6964594a0221cd921b85056d604bce9d8ce54df
      VULNIX_NO_ENV_LOCAL: "1"
    steps:
      - name: Checkout Vulnix
        uses: actions/checkout@v4

      - name: Checkout ARTEX at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARTEX_REPO }}
          ref: ${{ env.ARTEX_COMMIT }}
          path: artex-src
          persist-credentials: false

      - name: Verify the ARTEX pin
        run: test "$(git -C artex-src rev-parse HEAD)" = "$ARTEX_COMMIT"

      - name: Set up Go (version from ARTEX go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: artex-src/go.mod
          cache: false

      - name: Apply the planner-only overlay
        run: cp -R integrations/artex/overlay/. artex-src/

      - name: Build the overlay binary from ARTEX source
        working-directory: artex-src
        run: |
          go build -trimpath -ldflags "-X main.artexCommit=${ARTEX_COMMIT}" \
            -o "$RUNNER_TEMP/artex-vulnix-planner" ./cmd/vulnix-planner
          sha256sum "$RUNNER_TEMP/artex-vulnix-planner" | tee "$RUNNER_TEMP/artex-binary.sha256"
          echo "VULNIX_ARTEX_CI_BINARY_SHA256=$(cut -d' ' -f1 "$RUNNER_TEMP/artex-binary.sha256")" >> "$GITHUB_ENV"
          go version -m "$RUNNER_TEMP/artex-vulnix-planner" | head -8

      - name: Overlay Go tests (tool allowlist, loopback-only LLM, deny hook)
        working-directory: artex-src
        run: go test ./agent -run VulnixBridge -count=1 -v

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nftables (kernel confinement of the ARTEX process)
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 postgresql-client

      - name: An unprivileged database role for ARTEX (no superuser, no server programs/files)
        env:
          PGPASSWORD: artex-ci-only
        run: |
          psql -h 127.0.0.1 -U artex -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE artex_planner LOGIN PASSWORD 'artex-planner-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE DATABASE artex_planner OWNER artex_planner"

      - name: Real ARTEX -> Vulnix ProposalRouter -> Gateway (end to end)
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_EXPECTED_COMMIT: ${{ env.ARTEX_COMMIT }}
          VULNIX_ARTEX_EVIDENCE: ${{ runner.temp }}/artex-evidence.json
          VULNIX_ARTEX_GATEWAY_EVIDENCE: ${{ runner.temp }}/artex-gateway
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          # the superuser of the CI database: the overlay must refuse it
          VULNIX_ARTEX_SUPERUSER_DSN: postgres://artex:artex-ci-only@127.0.0.1:5432/artex?sslmode=disable
          # ARTEX runs inside Vulnix's kernel confinement (cgroup v2 + nftables + own uid +
          # seccomp launcher); the test fails if it is not confined
          VULNIX_ARTEX_CONFINE: "1"
          VULNIX_ARTEX_MULTISTEP_EVIDENCE: ${{ runner.temp }}/artex-multistep-evidence.json
          VULNIX_ARTEX_DIAGNOSIS_EVIDENCE: ${{ runner.temp }}/artex-diagnosis-evidence.json
        run: python3 -m unittest -v tests.test_artex_bridge tests.test_adaptive_plan_runner tests.test_diagnosis_loop

      - name: The real ARTEX test must have run (a skip is a failure)
        run: |
          test -s "$RUNNER_TEMP/artex-evidence.json"
          cat "$RUNNER_TEMP/artex-evidence.json"
          test -s "$RUNNER_TEMP/artex-multistep-evidence.json"
          test -s "$RUNNER_TEMP/artex-diagnosis-evidence.json"

      - name: Diagnosis loop comparison (fixed L1 / fixed rule / real ARTEX), same lab and budget
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_diagnosis_loop \
            --out "$RUNNER_TEMP/diagnosis-loop-comparison.json" > /dev/null
          python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))['summary'], indent=1))" \
            "$RUNNER_TEMP/diagnosis-loop-comparison.json"

      - name: Held-out diagnosis evaluation (30 unseen cases; no model is called)
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.run_model_evaluation freeze
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.run_model_evaluation compare --out "$RUNNER_TEMP/eval" > /dev/null
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({m: {k: s[k] for k in ('outcomes','tp','fp','fn','tn','precision','recall','unnecessary_checks','worker_launches','target_gets')} for m, s in d['summary'].items()}, indent=1)); sys.exit(1 if d['external_connection_attempts'] or d['checks_failed'] else 0)" \
            "$RUNNER_TEMP/eval/comparison_ci.json"

      - name: Same-lab status precision and cost comparison with real ARTEX
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_status_exposure_after > "$RUNNER_TEMP/status-exposure-comparison.json"
          test -s "$RUNNER_TEMP/status-exposure-comparison.json"

      - name: Independent access-control lab comparison with real ARTEX
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_access_control > "$RUNNER_TEMP/access-control-comparison.json"
          test -s "$RUNNER_TEMP/access-control-comparison.json"

      - name: Five-class blind evaluation from independent lab evidence
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_cors_policy_precision > "$RUNNER_TEMP/cors-policy-comparison.json"
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_cookie_purpose --current-only > "$RUNNER_TEMP/cookie-purpose-current.json"
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_multiclass \
            --cors-file "$RUNNER_TEMP/cors-policy-comparison.json" \
            --cookie-file "$RUNNER_TEMP/cookie-purpose-current.json" \
            --access-file "$RUNNER_TEMP/access-control-comparison.json" \
            --status-file "$RUNNER_TEMP/status-exposure-comparison.json" \
            > "$RUNNER_TEMP/multiclass-comparison.json"
          test -s "$RUNNER_TEMP/multiclass-comparison.json"

      - name: CORS and Cookie skip decision with real ARTEX on local HTTPS
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_initial_extra_selection --smoke > "$RUNNER_TEMP/initial-extra-selection.json"
          test -s "$RUNNER_TEMP/initial-extra-selection.json"

      - name: Mixed baseline and Apache check with real ARTEX on local HTTPS
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_initial_mixed_holdout --smoke > "$RUNNER_TEMP/initial-mixed-holdout.json"
          test -s "$RUNNER_TEMP/initial-mixed-holdout.json"

      - name: Status selection with real ARTEX on local HTTPS
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_status_selection_holdout --smoke > "$RUNNER_TEMP/status-selection-holdout.json"
          test -s "$RUNNER_TEMP/status-selection-holdout.json"

      - name: Withheld access conditions with real ARTEX and local model
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_access_holdout --smoke > "$RUNNER_TEMP/access-holdout-real-artex.json"
          test -s "$RUNNER_TEMP/access-holdout-real-artex.json"

      - name: First-prompt selection with real ARTEX and local model
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_first_prompt_selection --smoke > "$RUNNER_TEMP/first-prompt-selection.json"
          test -s "$RUNNER_TEMP/first-prompt-selection.json"

      - name: Apache status first-prompt comparison with real ARTEX
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_status_first_prompt --smoke > "$RUNNER_TEMP/status-first-prompt.json"
          test -s "$RUNNER_TEMP/status-first-prompt.json"

      - name: Unseen Link layouts with real ARTEX and local model
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_access_link_holdout --smoke > "$RUNNER_TEMP/access-link-holdout.json"
          test -s "$RUNNER_TEMP/access-link-holdout.json"

      - name: Five-class withheld comparison with local stand-in
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_initial_mixed_holdout > "$RUNNER_TEMP/mixed-holdout-full.json"
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_status_selection_holdout > "$RUNNER_TEMP/status-holdout-full.json"
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_access_holdout > "$RUNNER_TEMP/access-holdout-full.json"
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_five_class_holdout \
            --mixed-file "$RUNNER_TEMP/mixed-holdout-full.json" \
            --status-file "$RUNNER_TEMP/status-holdout-full.json" \
            --access-file "$RUNNER_TEMP/access-holdout-full.json" \
            > "$RUNNER_TEMP/five-class-holdout.json"
          test -s "$RUNNER_TEMP/five-class-holdout.json"

      - name: Set up Node.js for the owned-site browser path
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build the local production Web UI and install Chromium
        run: |
          npm --prefix web ci
          npm --prefix web run build
          python3 -m pip install --quiet -r requirements-oidc.txt
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Cloud Run ownership browser path with offline signed token
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_cloud_run_ownership_ui \
            > "$RUNNER_TEMP/cloud-run-ownership-ui.json"
          test -s "$RUNNER_TEMP/cloud-run-ownership-ui.json"

      - name: Local defense checks with a first-time user
        run: VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_quick_defense_ui

      - name: Separate ownership traffic approval in the browser
        run: VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_ownership_traffic_ui

      - name: Reviewed defense from a browser with distinct approval and the real kernel Worker
        run: |
          VULNIX_NO_ENV_LOCAL=1 VULNIX_TEST_LOCAL_DEFENSE_KERNEL=1 python3 -m unittest -v tests.test_local_defense.TestLocalDefenseOnLinux
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_reviewed_defense_ui

      - name: Owned-site 390px browser path with real ARTEX and local model
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          VULNIX_ARTEX_CONFINE: "1"
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.bench_browser_owned_flow \
            --production --real-artex --chromium > "$RUNNER_TEMP/real-artex-browser-flow.json"
          test -s "$RUNNER_TEMP/real-artex-browser-flow.json"

      - name: Diagnosis loop panel in a browser on the local lab (SSE, restart, tampering, other org)
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_diagnosis_ui --production --chromium \
            --screenshots "$RUNNER_TEMP/diagnosis-ui" > "$RUNNER_TEMP/diagnosis-ui.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d['checks'], indent=1)); sys.exit(0 if d['ok'] else 1)" \
            "$RUNNER_TEMP/diagnosis-ui.json"

      - name: Diagnosis operations in a browser on the local lab (start, owner spec, L2 approval, fix check)
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_diagnosis_actions --production --chromium \
            --screenshots "$RUNNER_TEMP/diagnosis-actions" > "$RUNNER_TEMP/diagnosis-actions.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d['checks'], indent=1)); sys.exit(0 if d['ok'] else 1)" \
            "$RUNNER_TEMP/diagnosis-actions.json"

      - name: A first-time user in a browser on the local lab (sign-up, start, invite an approver, approve, fix check)
        run: |
          VULNIX_NO_ENV_LOCAL=1 python3 -m scripts.check_first_run --production --chromium \
            --screenshots "$RUNNER_TEMP/first-run" > "$RUNNER_TEMP/first-run.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d['checks'], indent=1)); sys.exit(0 if d['ok'] else 1)" \
            "$RUNNER_TEMP/first-run.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artex-real-planner-evidence
          path: |
            ${{ runner.temp }}/artex-evidence.json
            ${{ runner.temp }}/artex-binary.sha256
            ${{ runner.temp }}/artex-gateway.forward.json
            ${{ runner.temp }}/artex-gateway.preview.json
            ${{ runner.temp }}/multiclass-comparison.json
            ${{ runner.temp }}/initial-mixed-holdout.json
            ${{ runner.temp }}/status-selection-holdout.json
            ${{ runner.temp }}/access-holdout-real-artex.json
            ${{ runner.temp }}/cloud-run-ownership-ui.json
            ${{ runner.temp }}/first-prompt-selection.json
            ${{ runner.temp }}/status-first-prompt.json
            ${{ runner.temp }}/access-link-holdout.json
            ${{ runner.temp }}/five-class-holdout.json
            ${{ runner.temp }}/status-exposure-comparison.json
            ${{ runner.temp }}/access-control-comparison.json
            ${{ runner.temp }}/initial-extra-selection.json
            ${{ runner.temp }}/real-artex-browser-flow.json
            ${{ runner.temp }}/diagnosis-ui.json
            ${{ runner.temp }}/diagnosis-ui/*.png
            ${{ runner.temp }}/diagnosis-actions.json
            ${{ runner.temp }}/diagnosis-actions/*.png
            ${{ runner.temp }}/first-run.json
            ${{ runner.temp }}/first-run/*.png
          if-no-files-found: warn
