name: Vulnix CI & Security Control Verification

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    # PRs into a feature branch (stacked PRs) are checked too, not only PRs into main
    branches: ["main", "feat/**"]
  workflow_dispatch:

jobs:
  backend-and-linux-isolation:
    name: Python Suite + Linux Kernel nftables & Emergency Stop Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux nftables and iproute2
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2

      - name: Run Python Unit & Integration Test Suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Linux kernel confinement end to end (confined L2 worker; stop, revocation, deletion, expiry)
        run: |
          # The same tests also run in the suite above; here a skip is a failure, so
          # a runner without cgroup v2 / nft / sudo cannot pass this step silently.
          python3 -m unittest -v tests.test_release_safety.TestOnLinuxWithTheRealKernelConfinement \
            tests.test_fail_closed.TestKernelConfinementOnLinux 2>&1 | tee linux-e2e.log
          if grep -q "skipped" linux-e2e.log; then echo "Linux confinement tests were skipped"; exit 1; fi
          grep -q "^OK" linux-e2e.log

      - name: Verify Linux Kernel nftables NetNS Isolation & Emergency Stop (P0)
        run: |
          sudo python3 -m aegis.control_verification

      - name: Verify ARTEX CLI & Abliteration OpenAI API Live Round-Trip (P1)
        run: |
          python3 -c '
          import json
          from aegis.router import verify_planner_connections
          rep = verify_planner_connections()
          print(json.dumps(rep, ensure_ascii=False, indent=2))
          assert rep["all_verified"], rep
          '

      - name: Verify Real Software Stack (SQLite + Sandbox FS) CVE Before/After Remediation (P2)
        run: |
          python3 -m aegis.real_software_cve

  frontend:
    name: Next.js Web UI Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build

  artex-real-planner:
    # The REAL ARTEX planner (github.com/Autumn-27/artex, AGPL-3.0), pinned by commit,
    # built with Vulnix's planner-only overlay and driven by a LOCAL mock LLM. Its
    # intents are rebuilt by Vulnix and executed only through the Gateway.
    name: Real ARTEX planner (overlay build) -> Vulnix Gateway, local mock LLM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # ARTEX's store is PostgreSQL: a throw-away database local to this runner
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-only
          POSTGRES_DB: artex
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U artex" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ARTEX_REPO: jiwoochris/artex-global
      ARTEX_COMMIT: d6964594a0221cd921b85056d604bce9d8ce54df
      VULNIX_NO_ENV_LOCAL: "1"
    steps:
      - name: Checkout Vulnix
        uses: actions/checkout@v4

      - name: Checkout ARTEX at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARTEX_REPO }}
          ref: ${{ env.ARTEX_COMMIT }}
          path: artex-src
          persist-credentials: false

      - name: Verify the ARTEX pin
        run: test "$(git -C artex-src rev-parse HEAD)" = "$ARTEX_COMMIT"

      - name: Set up Go (version from ARTEX go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: artex-src/go.mod
          cache: false

      - name: Apply the planner-only overlay
        run: cp -R integrations/artex/overlay/. artex-src/

      - name: Build the overlay binary from ARTEX source
        working-directory: artex-src
        run: |
          go build -trimpath -ldflags "-X main.artexCommit=${ARTEX_COMMIT}" \
            -o "$RUNNER_TEMP/artex-vulnix-planner" ./cmd/vulnix-planner
          sha256sum "$RUNNER_TEMP/artex-vulnix-planner" | tee "$RUNNER_TEMP/artex-binary.sha256"
          echo "VULNIX_ARTEX_CI_BINARY_SHA256=$(cut -d' ' -f1 "$RUNNER_TEMP/artex-binary.sha256")" >> "$GITHUB_ENV"
          go version -m "$RUNNER_TEMP/artex-vulnix-planner" | head -8

      - name: Overlay Go tests (tool allowlist, loopback-only LLM, deny hook)
        working-directory: artex-src
        run: go test ./agent -run VulnixBridge -count=1 -v

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nftables (kernel confinement of the ARTEX process)
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 postgresql-client

      - name: An unprivileged database role for ARTEX (no superuser, no server programs/files)
        env:
          PGPASSWORD: artex-ci-only
        run: |
          psql -h 127.0.0.1 -U artex -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE artex_planner LOGIN PASSWORD 'artex-planner-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE DATABASE artex_planner OWNER artex_planner"

      - name: Real ARTEX -> Vulnix ProposalRouter -> Gateway (end to end)
        env:
          VULNIX_ARTEX_REAL_BIN: ${{ runner.temp }}/artex-vulnix-planner
          VULNIX_ARTEX_EXPECTED_COMMIT: ${{ env.ARTEX_COMMIT }}
          VULNIX_ARTEX_EVIDENCE: ${{ runner.temp }}/artex-evidence.json
          VULNIX_ARTEX_PG_DSN: postgres://artex_planner:artex-planner-ci-only@127.0.0.1:5432/artex_planner?sslmode=disable
          # the superuser of the CI database: the overlay must refuse it
          VULNIX_ARTEX_SUPERUSER_DSN: postgres://artex:artex-ci-only@127.0.0.1:5432/artex?sslmode=disable
          # ARTEX runs inside Vulnix's kernel confinement (cgroup v2 + nftables + own uid +
          # seccomp launcher); the test fails if it is not confined
          VULNIX_ARTEX_CONFINE: "1"
        run: python3 -m unittest -v tests.test_artex_bridge

      - name: The real ARTEX test must have run (a skip is a failure)
        run: |
          test -s "$RUNNER_TEMP/artex-evidence.json"
          cat "$RUNNER_TEMP/artex-evidence.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artex-real-planner-evidence
          path: |
            ${{ runner.temp }}/artex-evidence.json
            ${{ runner.temp }}/artex-binary.sha256
          if-no-files-found: warn
