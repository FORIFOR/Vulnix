# Administration over SSH with keys only. TCP forwarding stays available for an
# administrator's tunnel to the loopback-only web server.
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PermitRootLogin no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# no compression: the LZ77 side channel and the decompression length check (OpenSSH < 10.6)
Compression no
