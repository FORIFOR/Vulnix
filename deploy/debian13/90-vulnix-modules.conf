# Network protocol modules an ordinary user could load just by opening a socket of that
# kind. Vulnix and the host never use them; loading is refused (also for root through
# modprobe; a deliberate `insmod` by root still works). Lima's vsock is NOT listed.
install sctp /bin/false
install dccp /bin/false
install tipc /bin/false
install rds /bin/false
install smc /bin/false
install l2tp_core /bin/false
install l2tp_ppp /bin/false
install l2tp_ip /bin/false
install l2tp_ip6 /bin/false
install af_key /bin/false
install kcm /bin/false
install algif_hash /bin/false
install algif_skcipher /bin/false
install algif_aead /bin/false
install algif_rng /bin/false
install af_alg /bin/false
