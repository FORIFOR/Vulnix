# Vulnix deployment candidate (Debian 13). Kernel attack surface for local users.
# Unprivileged user namespaces off: an unprivileged process cannot gain CAP_NET_ADMIN
# in a namespace of its own (nf_tables / nft_ct and similar kernel CVEs). Vulnix creates
# its worker namespaces as root, so confinement is unaffected (verified on this image).
kernel.unprivileged_userns_clone = 0
# io_uring off for everyone (workers already refuse it by seccomp)
kernel.io_uring_disabled = 2
kernel.unprivileged_bpf_disabled = 2
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
